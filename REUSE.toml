# REUSE.toml -- machine-readable license mapping for ForkSploit.
#
# ForkSploit is multi-licensed PER COMPONENT (path), not per-file-header.
# The authoritative map is LICENSING.md; this file records the same mapping in
# machine-readable form. Tooling: https://reuse.software
version = 1

[[annotations]]
path = "src/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "benches/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "onchain_scripts/**/*.py"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "onchain_scripts/contracts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "LicenseRef-Proprietary"

[[annotations]]
path = "onchain_scripts/llm_poc/contracts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "LicenseRef-Proprietary"

[[annotations]]
path = "onchain_scripts/dashboard_static/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "server/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "skills/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dany Tech"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "LICENSES/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The respective license authors"
SPDX-License-Identifier = "CC0-1.0"

# Third-party code keeps its upstream license and is NOT relicensed.
[[annotations]]
path = "vendor/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The serde_traitobject authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

