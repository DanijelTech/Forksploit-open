name: Release version

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  IS_NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
      changelog: ${{ steps.build_changelog.outputs.changelog }}
      body: ${{ steps.tag_body.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed so `git tag -l --format=%(contents)` can read the
          # annotated tag's own notes below -- actions/checkout does NOT
          # fetch tag objects by default, which made the tag body empty and
          # silently fall back to the auto-changelog.
          fetch-tags: true

      - name: Compute release name and tag
        id: release_info
        run: |
          # NOTE: IS_NIGHTLY is the STRING "true"/"false" (env values are
          # always strings), and `[[ "false" ]]` is TRUE in bash -- so this
          # must compare explicitly, never test bare truthiness.
          if [[ "$IS_NIGHTLY" == "true" ]]; then
            echo "tag_name=nightly-${GITHUB_SHA}" >> $GITHUB_OUTPUT
            echo "release_name=Nightly ($(date '+%Y-%m-%d'))" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      # Creates a `nightly-SHA` tag for this specific nightly.
      # This tag is used for this specific nightly version's release,
      # which allows users to roll back. It is also used to build the changelog.
      - name: Create build-specific nightly tag
        if: ${{ env.IS_NIGHTLY == 'true' }}
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.release_info.outputs.tag_name }}
        with:
          script: |
            const createTag = require('./.github/scripts/create-tag.js')
            await createTag({ github, context }, process.env.TAG_NAME)

      # Best-effort changelog. Non-fatal: a missing/failed comparison (e.g. a
      # shallow history, or a tag with no PR labels) must not block the
      # release -- the release body falls back to the tag notes when empty.
      - name: Build changelog
        id: build_changelog
        continue-on-error: true
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: "./.github/changelog.json"
          fromTag: ${{ env.IS_NIGHTLY == 'true' && 'nightly' || '' }}
          toTag: ${{ steps.release_info.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # For a versioned release the annotated tag carries the curated notes
      # (Added / Changed / Fixed / Security). Prefer those; only fall back to
      # the auto-changelog when the tag has no annotation of its own.
      - name: Use the tag annotation as the release body
        if: ${{ env.IS_NIGHTLY != 'true' }}
        id: tag_body
        run: |
          # Explicitly fetch THIS tag: actions/checkout may not carry the
          # annotated tag object even with fetch-tags, so `git tag -l` can
          # return nothing and the body silently falls back to the
          # auto-changelog. Fetching the ref directly is the reliable way.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          TAG_BODY="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          if [ -z "$TAG_BODY" ]; then
            TAG_BODY='${{ steps.build_changelog.outputs.changelog }}'
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            printf '%s\n' "$TAG_BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        job:
          # Linux x86_64 only -- the single first-class release target.
          # The previous matrix also listed macOS/Windows/self-hosted-ARM,
          # but that never produced a release: the macOS runner is arm64
          # while the matrix asked for an x86_64 cross-target whose std the
          # pinned toolchain did not carry (error[E0463]: can't find crate
          # for `core`), and the ARM job needed an ephemeral AWS EC2 runner.
          # A native Linux build needs no cross-target and no paid
          # macOS/Windows minutes, so it is the reliable, always-green path.
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            arch: amd64
            svm_target_platform: linux-amd64

    steps:
      - uses: actions/checkout@v4

      # Install the EXACT toolchain rust-toolchain.toml pins (single source
      # of truth). Previously this step hard-coded nightly-2024-01-01 while
      # rust-toolchain.toml pins a different nightly -- rustup gave the file
      # precedence, so the hard-coded toolchain (with its cross-targets) was
      # never the one cargo actually used.
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: |
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "Toolchain from rust-toolchain.toml: ${CHANNEL:-<none>}"
          if [ -n "$CHANNEL" ]; then
            rustup toolchain install "$CHANNEL" --profile minimal
            rustup default "$CHANNEL"
          fi
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: "v2"
          key: ${{ matrix.job.target }}

      # System prerequisites for the build: Z3 (linked by z3-sys), plus the
      # C/C++ toolchain and cmake the project's own README lists.
      - name: Linux setup (z3, clang, cmake, pkg-config)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libz3-dev libssl-dev libudev-dev \
            pkg-config clang cmake build-essential

      - name: Build binaries
        env:
          SVM_TARGET_PLATFORM: ${{ matrix.job.svm_target_platform }}
        # Native build -- no --target, so no cross std is ever needed.
        run: cargo build --release --bins --features "cmp dataflow evm print_txn_corpus full_trace force_cache real_balance" --no-default-features --locked

      - name: Archive binaries
        id: artifacts
        env:
          PLATFORM_NAME: ${{ matrix.job.platform }}
          TARGET: ${{ matrix.job.target }}
          ARCH: ${{ matrix.job.arch }}
          VERSION_NAME: ${{ (env.IS_NIGHTLY == 'true' && 'nightly') || needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          chmod +x "./target/release/forksploit"
          tar -czvf "forksploit_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" -C ./target/release forksploit
          echo "file_name=forksploit_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" >> $GITHUB_OUTPUT

      # Creates the release for this specific version.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          prerelease: ${{ env.IS_NIGHTLY == 'true' }}
          body: ${{ needs.prepare.outputs.body || needs.prepare.outputs.changelog }}
          files: |
            ${{ steps.artifacts.outputs.file_name }}

      # If this is a nightly release, it also updates the release tagged
      # `nightly` so a fixed URL always points at the latest build.
      - name: Update nightly release
        if: ${{ env.IS_NIGHTLY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: "Nightly"
          tag_name: "nightly"
          prerelease: true
          body: ${{ needs.prepare.outputs.changelog }}
          files: |
            ${{ steps.artifacts.outputs.file_name }}

  cleanup:
    name: Release cleanup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: release
    steps:
      - uses: actions/checkout@v4

      # Moves the `nightly` tag to `HEAD`.
      - name: Move nightly tag
        if: ${{ env.IS_NIGHTLY == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const moveTag = require('./.github/scripts/move-tag.js')
            await moveTag({ github, context }, 'nightly')

      - name: Delete old nightlies
        uses: actions/github-script@v7
        with:
          script: |
            const prunePrereleases = require('./.github/scripts/prune-prereleases.js')
            await prunePrereleases({github, context})

  # If any of the jobs fail, this opens/updates a high-priority issue.
  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [prepare, release, cleanup]
    if: ${{ failure() }}
    steps:
      - uses: actions/checkout@v4
      - uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/RELEASE_FAILURE_ISSUE_TEMPLATE.md
